<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyStudio — редактор Python</title><link rel="icon" href="logo.webp">
<style>
html,body{height:100%;margin:0}body{font-family:Inter,Segoe UI,Arial,sans-serif;background:#f8fafc;color:#0f172a}.app{min-height:100vh;padding:16px}.top{max-width:1400px;margin:0 auto 16px;border-radius:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:10px;background:#fff;border:1px solid #e2e8f0}.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;color:#0f172a}.brand img{height:32px;width:auto}.brand b{color:#4f46e5}.file{font-size:13px;color:#64748b}.actions{display:flex;flex-wrap:wrap;gap:8px}.upload-button{display:inline-flex;align-items:center;cursor:pointer;font:inherit;border:1px solid #cbd5e1;background:#e2e8f0;color:#0f172a;padding:8px 12px;border-radius:10px}.upload-button:hover{filter:brightness(.97)}.upload-button input{display:none}button{font:inherit;border:1px solid #cbd5e1;background:#e2e8f0;color:#0f172a;padding:8px 12px;border-radius:10px;cursor:pointer}button:hover{filter:brightness(.97)}.run{color:#fff;background:#4f46e5;border-color:#4f46e5;font-weight:600}.run:hover{background:#4338ca}.layout{max-width:1400px;margin:auto;min-height:calc(100vh - 100px);display:grid;grid-template-columns:1fr 1fr;gap:16px}.editor-col,.output-col{min-width:0;border-radius:16px;background:#fff;border:1px solid #e2e8f0;overflow:hidden;display:flex;flex-direction:column}.pane-head{padding:10px 12px;border-bottom:1px solid #e2e8f0;font-size:14px;display:flex;align-items:center;min-height:45px}.dotfile{color:#4f46e5;margin-right:7px}.shortcut{margin-left:auto;color:#64748b;font-size:12px}.code-wrap{display:flex;position:relative;flex:1;min-height:0;background:#fff;overflow:hidden}#lineNumbers{box-sizing:border-box;flex:0 0 52px;margin:0;padding:12px 10px;text-align:right;color:#94a3b8;background:#f8fafc;border-right:1px solid #e2e8f0;font:14px/22px ui-monospace,Consolas,monospace;white-space:pre;overflow:hidden;user-select:none}textarea{box-sizing:border-box;display:block;flex:1;min-width:0;height:100%;border:0;outline:0;resize:none;padding:12px;color:#0f172a;background:#fff;font:14px/22px ui-monospace,Consolas,monospace;line-height:22px;tab-size:4;white-space:pre;overflow:auto}.status{padding:7px 12px;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;background:#f8fafc}.output-head{background:#fff}.output-head .state{display:flex;gap:7px;align-items:center}.state span{width:8px;height:8px;border-radius:50%;background:#94a3b8}.state.running span{background:#f59e0b}.state.done span{background:#22c55e}.clear{margin-left:auto;padding:5px 9px;font-size:12px}.output{flex:1;min-height:0;overflow:auto;padding:12px;background:#fff;color:#0f172a;font:14px/22px ui-monospace,Consolas,monospace}.welcome,.entry.system{color:#64748b}.entry{white-space:pre-wrap;word-break:break-word}.entry.error{color:#dc2626}.entry.result{color:#334155}.entry.input{display:flex;align-items:center;gap:8px;color:#334155}.entry.input input{width:150px;padding:5px 7px;border:1px solid #94a3b8;border-radius:6px;font:inherit}.assets{border-top:1px solid #e2e8f0;padding:8px 12px;background:#f8fafc;color:#475569;font-size:12px}.assets:empty{display:none}.asset{display:inline-flex;align-items:center;gap:5px;margin:2px 5px 2px 0;padding:3px 6px;background:#e0e7ff;border-radius:5px}.asset img{width:18px;height:18px;object-fit:cover;border-radius:3px}.canvas-stage{height:100%;min-height:300px;display:grid;place-items:center;background:#f8fafc}canvas{max-width:92%;max-height:92%;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 20px #0f172a18}.tk-window{width:min(430px,90%);background:#fff;color:#0f172a;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 20px #0f172a18;font-family:Arial}.tk-title{background:#eef2ff;padding:8px 11px;font-size:13px}.tk-body{padding:25px;min-height:150px}.tk-body button{background:#e2e8f0;color:#0f172a;border-color:#cbd5e1;padding:6px 14px}@media(max-width:850px){.layout{grid-template-columns:1fr;grid-template-rows:58vh 50vh}.top{align-items:flex-start}.file{order:3;width:100%}}
</style>
</head><body>
<div class="app"><header class="top"><div class="brand"><img src="logo.webp" alt="PyStudio"><span>Py<b>Studio</b></span></div><span class="file">main.py · локальный проект</span><div class="actions"><label class="upload-button">↥ Открыть .py<input id="pythonFile" type="file" accept=".py,text/x-python"></label><label class="upload-button">＋ Медиа<input id="mediaFiles" type="file" accept="image/*,audio/*" multiple></label><button id="save">⤓ Скачать .py</button><button id="reset">↺ Пример</button><button class="run" id="run">▶ Запустить <span class="shortcut">Ctrl ↵</span></button></div></header>
<main class="layout">
<section class="editor-col"><div class="pane-head"><span class="dotfile">●</span>main.py <span class="shortcut">Python 3 · UTF-8</span></div><div class="code-wrap"><pre id="lineNumbers">1</pre><textarea id="code" spellcheck="false" aria-label="Редактор Python"></textarea></div><div class="status">Готово к запуску · встроенный Python-рантайм</div><div id="assets" class="assets" aria-live="polite"></div></section>
<section class="output-col"><div class="pane-head output-head"><div id="runState" class="state"><span></span><b>Консоль</b></div><button class="clear" id="clear">Очистить</button></div><div class="output" id="output" aria-live="polite"></div></section></main></div>
<script>
(()=>{
  const code=document.querySelector('#code'), out=document.querySelector('#output'), lines=document.querySelector('#lineNumbers'), state=document.querySelector('#runState'), assetsBox=document.querySelector('#assets');
  const example=`# Добро пожаловать в PyStudio!
# Код выполняется локально, без подключения к интернету.

number = int(input("Введите число: "))
print("Удвоенное значение:", number * 2)`;
  const assets=[];
  code.value=localStorage.pyStudioCode||example;
  function update(){
    const count=code.value.split('\n').length;
    lines.textContent=Array.from({length:count},(_,i)=>i+1).join('\n');
    localStorage.pyStudioCode=code.value;
  }
  code.addEventListener('input',update);
  code.addEventListener('scroll',()=>{lines.scrollTop=code.scrollTop});
  code.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();const a=code.selectionStart;code.setRangeText('    ',a,code.selectionEnd,'end');update()}
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}
  });
  update();
  function add(text,kind=''){const d=document.createElement('div');d.className='entry '+kind;d.textContent=text;out.append(d);out.scrollTop=out.scrollHeight;return d}
  function clear(){out.innerHTML=''}
  function showError(error){clear();add('Ошибка: '+error.message,'error');state.className='state';state.querySelector('b').textContent='Ошибка'}
  function renderAssets(){
    assetsBox.innerHTML='';
    assets.forEach(asset=>{const item=document.createElement('span');item.className='asset';
      if(asset.type.startsWith('image/')){const image=document.createElement('img');image.src=asset.url;image.alt='';item.append(image)}
      item.append(document.createTextNode(asset.type.startsWith('audio/')?'♫ '+asset.name:'▣ '+asset.name));assetsBox.append(item);
    });
  }
  document.querySelector('#pythonFile').addEventListener('change',async event=>{
    const file=event.target.files[0]; if(!file)return;
    try{code.value=await file.text();update();state.className='state';state.querySelector('b').textContent='Файл загружен'}catch(error){showError(error)}
    event.target.value='';
  });
  document.querySelector('#mediaFiles').addEventListener('change',event=>{
    Array.from(event.target.files).forEach(file=>assets.push({name:file.name,type:file.type,url:URL.createObjectURL(file)}));
    renderAssets();event.target.value='';
  });
  function value(source,env){
    let s=source.trim().replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null');
    s=s.replace(/random\.randint\(([^,]+),([^\)]+)\)/g,'(Math.floor(Math.random()*($2-$1+1))+$1)').replace(/random\.choice\(([^\)]+)\)/g,'$1[Math.floor(Math.random()*$1.length)]').replace(/\bstr\(/g,'String(').replace(/\bint\(/g,'parseInt(').replace(/\bfloat\(/g,'parseFloat(').replace(/\bround\(/g,'Math.round(');
    try{return Function(...Object.keys(env),'return ('+s+')')(...Object.values(env))}catch(error){return s.replace(/^['"]|['"]$/g,'')}
  }
  function stageCanvas(){out.innerHTML='';const s=document.createElement('div');s.className='canvas-stage';const c=document.createElement('canvas');c.width=700;c.height=500;s.append(c);out.append(s);return c.getContext('2d')}
  function turtle(src){const ctx=stageCanvas(),env={},p={x:350,y:250,a:-90,pen:true,color:'#111827',width:2};ctx.lineCap='round';ctx.lineJoin='round';function draw(dist){const r=p.a*Math.PI/180,nx=p.x+Math.cos(r)*dist,ny=p.y+Math.sin(r)*dist;if(p.pen){ctx.strokeStyle=p.color;ctx.lineWidth=p.width;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nx,ny);ctx.stroke()}p.x=nx;p.y=ny}function one(line){line=line.trim();if(!line||line.startsWith('#')||line.startsWith('from ')||line.startsWith('import '))return;let m;if(m=line.match(/^(forward|fd)\((.+)\)/))draw(+value(m[2],env));else if(m=line.match(/^(backward|bk)\((.+)\)/))draw(-value(m[2],env));else if(m=line.match(/^(right|rt)\((.+)\)/))p.a+=+value(m[2],env);else if(m=line.match(/^(left|lt)\((.+)\)/))p.a-=+value(m[2],env);else if(m=line.match(/^color\((.+)\)/)){p.color=String(value(m[1],env)).split(',')[0].replace(/[()'" ]/g,'')||p.color}else if(m=line.match(/^pensize\((.+)\)/))p.width=+value(m[1],env);else if(/^penup\(\)/.test(line))p.pen=false;else if(/^pendown\(\)/.test(line))p.pen=true;else if(m=line.match(/^goto\((.+),(.+)\)/)){p.x=+value(m[1],env);p.y=+value(m[2],env)}else if(m=line.match(/^(\w+)\s*=\s*(.+)$/))env[m[1]]=value(m[2],env)}let a=src.split('\n');for(let i=0;i<a.length;i++){let m=a[i].match(/^\s*for\s+(\w+)\s+in\s+range\(([^)]*)\):/);if(m){let block=[],indent=a[i+1]?.match(/^\s*/)[0].length||0;while(++i<a.length&&a[i].match(/^\s*/)[0].length>=indent)block.push(a[i]);let x=m[2].split(',').map(q=>+value(q,env));let start=x.length===1?0:x[0],end=x.length===1?x[0]:x[1],step=x[2]||1;for(let n=start;n<end;n+=step){env[m[1]]=n;block.forEach(one)}}else one(a[i])}}
  function consoleRun(src){
    clear();const env={},program=src.split('\n');
    const indentation=line=>line.match(/^\s*/)[0].replace(/\t/g,'    ').length;
    function finish(){state.className='state done';state.querySelector('b').textContent='Завершено'}
    function runLines(lines,index,baseIndent,done){
      try{while(index<lines.length){const raw=lines[index],line=raw.trim(),lineNumber=program.indexOf(raw)+1;if(!line||line.startsWith('#')){index++;continue}
        const indent=indentation(raw);if(indent<baseIndent){done(index);return}if(indent>baseIndent)throw new Error('Неожиданный отступ в строке '+lineNumber);
        let m;
        if(m=line.match(/^for\s+(\w+)\s+in\s+range\((.*)\):$/)){
          const argumentsList=m[2].split(',').map(part=>Number(value(part,env)));
          if(argumentsList.length<1||argumentsList.length>3||argumentsList.some(Number.isNaN))throw new Error('Некорректный range в строке '+lineNumber);
          const [start,end,step]=argumentsList.length===1?[0,argumentsList[0],1]:argumentsList.length===2?[argumentsList[0],argumentsList[1],1]:argumentsList;
          if(step===0)throw new Error('Шаг range не может быть равен нулю в строке '+lineNumber);
          let blockEnd=index+1;while(blockEnd<lines.length&&(!lines[blockEnd].trim()||indentation(lines[blockEnd])>indent))blockEnd++;
          const block=lines.slice(index+1,blockEnd),blockIndent=block.find(item=>item.trim()&&!item.trim().startsWith('#'));
          if(!blockIndent)throw new Error('После for ожидается блок с отступом в строке '+lineNumber);
          let current=start;
          function iterate(){if(step>0?current>=end:current<=end){index=blockEnd;return runLines(lines,index,baseIndent,done)}env[m[1]]=current;current+=step;runLines(block,0,indentation(blockIndent),iterate)}
          return iterate();
        }
        index++;
        if(line.startsWith('import ')||line.startsWith('from '))continue;
        if(m=line.match(/^print\((.*)\)$/)){const values=m[1].split(/,(?![^\[]*\])/).map(part=>value(part,env));add(values.join(' '),'result');continue}
        if(m=line.match(/^(\w+)\s*=\s*(int|float)\(\s*input\((.*)\)\s*\)$/)){requestInput(m[3],answer=>{env[m[1]]=m[2]==='int'?parseInt(answer,10):parseFloat(answer);runLines(lines,index,baseIndent,done)},true);return}
        if(m=line.match(/^(\w+)\s*=\s*input\((.*)\)$/)){requestInput(m[2],answer=>{env[m[1]]=answer;runLines(lines,index,baseIndent,done)});return}
        if(m=line.match(/^input\((.*)\)$/)){requestInput(m[1],()=>runLines(lines,index,baseIndent,done));return}
        if(m=line.match(/^(\w+)\s*=\s*(.+)$/)){env[m[1]]=value(m[2],env);continue}
        throw new Error('Не удалось выполнить строку '+lineNumber+': '+line);
      }done(index)}catch(error){showError(error)}
    }
    function requestInput(prompt,done,numeric=false){const row=document.createElement('label');row.className='entry input';const caption=value(prompt,env);row.append(document.createTextNode(caption?String(caption):'Ввод:'));const field=document.createElement('input');field.type=numeric?'number':'text';if(numeric)field.step='any';field.autocomplete='off';field.setAttribute('aria-label',caption||'Ввод программы');row.append(field);out.append(row);field.focus();out.scrollTop=out.scrollHeight;field.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();field.disabled=true;done(field.value)}})}
    runLines(program,0,0,finish);
  }
  function windowStage(src,qt=false){out.innerHTML='';const s=document.createElement('div');s.className='canvas-stage';const w=document.createElement('div');w.className='tk-window';const label=(src.match(/Label\([^\n]*/) || [])[0]||'Окно приложения';w.innerHTML='<div class="tk-title">'+(qt?'PyQt application':'tkinter')+'</div><div class="tk-body">'+label+'<br><br><button>Кнопка</button></div>';s.append(w);out.append(s)}
  function run(){state.className='state running';state.querySelector('b').textContent='Выполняется';try{const src=code.value;if(/\b(turtle|pygame)\b/.test(src)){turtle(src);state.className='state done';state.querySelector('b').textContent='Завершено'}else if(/\b(tkinter|PyQt|QApplication)\b/.test(src)){windowStage(src,/PyQt/.test(src));state.className='state done';state.querySelector('b').textContent='Завершено'}else consoleRun(src)}catch(error){showError(error)}}
  document.querySelector('#run').onclick=run;document.querySelector('#clear').onclick=clear;document.querySelector('#reset').onclick=()=>{code.value=example;update()};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code.value],{type:'text/x-python'}));a.download='main.py';a.click();URL.revokeObjectURL(a.href)};
})();
</script></body></html>
