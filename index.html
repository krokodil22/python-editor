</head><body>
<div class="app"><header class="top"><div class="brand"><img src="logo.webp" alt="PyStudio"><span>Py<b>Studio</b></span></div><div class="actions"><label class="upload-button">↥ Открыть .py<input id="pythonFile" type="file" accept=".py,text/x-python"></label><label class="upload-button">＋ Медиа<input id="mediaFiles" type="file" accept="image/*,audio/*" multiple></label><button id="save">⤓ Скачать .py</button><label class="setting" for="fontSize">Кегль <select id="fontSize" aria-label="Кегль кода"><option value="12">12</option><option value="14">14</option><option value="16">16</option><option value="18">18</option><option value="20">20</option><option value="22">22</option></select></label><button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" title="Включить тёмную тему" aria-label="Включить тёмную тему">☾</button><button class="layout-toggle" id="layoutToggle" type="button" aria-pressed="false" title="Расположить редактор над консолью">↕ Вид</button></div><div class="run-control"><button class="run" id="run">▶ Запустить</button><div id="runState" class="state" role="status"><span></span><b>Готово</b></div></div></header>
<main class="layout" id="layout">
<section class="editor-col"><div class="code-wrap"><pre id="lineNumbers">1</pre><div class="editor-area"><pre id="highlighting" aria-hidden="true"><code></code></pre><textarea id="code" wrap="off" spellcheck="false" aria-label="Редактор Python"></textarea></div></div><div id="assets" class="assets" aria-live="polite"></div></section>
<button class="pane-divider" id="paneDivider" type="button" aria-label="Изменить размер редактора и консоли" title="Потяните, чтобы изменить размер"></button>
<section class="output-col"><button class="clear" id="clear" type="button" title="Очистить консоль" aria-label="Очистить консоль"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button><div class="output" id="output" aria-live="polite"></div></section></main></div>
<script>
(()=>{
  const code=document.querySelector('#code'), highlighting=document.querySelector('#highlighting code'), highlightLayer=document.querySelector('#highlighting'), out=document.querySelector('#output'), lines=document.querySelector('#lineNumbers'), state=document.querySelector('#runState'), assetsBox=document.querySelector('#assets'), layout=document.querySelector('#layout');
  const example=`# Добро пожаловать в PyStudio!
# Python-рантайм загружается при первом запуске.

number = int(input("Введите число: "))
print("Удвоенное значение:", number * 2)`;
  const assets=[],assetImageCache=new Map();
  code.value=localStorage.pyStudioCode||example;
  const fontSize=document.querySelector('#fontSize'),layoutToggle=document.querySelector('#layoutToggle'),paneDivider=document.querySelector('#paneDivider'),themeToggle=document.querySelector('#themeToggle');
  function setTheme(theme){
    const dark=theme==='dark';
    document.documentElement.dataset.theme=dark?'dark':'light';themeToggle.setAttribute('aria-pressed',String(dark));themeToggle.textContent=dark?'☀':'☾';themeToggle.title=dark?'Включить светлую тему':'Включить тёмную тему';themeToggle.setAttribute('aria-label',themeToggle.title);localStorage.pyStudioTheme=dark?'dark':'light';
  }
  function setFontSize(value){
    const size=['12','14','16','18','20','22'].includes(String(value))?String(value):'14';
    fontSize.value=size;layout.style.setProperty('--code-size',size+'px');layout.style.setProperty('--code-leading',Math.round(Number(size)*1.55)+'px');localStorage.pyStudioFontSize=size;
  }
  function isVerticalSplit(){return layout.classList.contains('stacked')||matchMedia('(max-width:850px)').matches}
  function setStacked(value){
    layout.classList.toggle('stacked',value);layoutToggle.setAttribute('aria-pressed',String(value));layoutToggle.textContent=value?'⇆ Вид':'↕ Вид';layoutToggle.title=value?'Расположить редактор и консоль рядом':'Расположить редактор над консолью';localStorage.pyStudioStacked=String(value);
    layout.style.removeProperty('--first-pane');
  }
  setFontSize(localStorage.pyStudioFontSize||'14');setStacked(localStorage.pyStudioStacked==='true');setTheme(document.documentElement.dataset.theme);
  fontSize.addEventListener('change',event=>setFontSize(event.target.value));themeToggle.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));layoutToggle.addEventListener('click',()=>setStacked(!layout.classList.contains('stacked')));
  paneDivider.addEventListener('pointerdown',event=>{
    if(event.button!==0)return;
    event.preventDefault();paneDivider.setPointerCapture(event.pointerId);layout.classList.add('resizing');
  });
  paneDivider.addEventListener('pointermove',event=>{
    if(!paneDivider.hasPointerCapture(event.pointerId))return;
    const bounds=layout.getBoundingClientRect(),vertical=isVerticalSplit();
    const available=(vertical?bounds.height:bounds.width)-14;
    const position=(vertical?event.clientY-bounds.top:event.clientX-bounds.left)-7;
    layout.style.setProperty('--first-pane',Math.max(240,Math.min(available-240,position))+'px');
  });
  const finishResize=event=>{if(paneDivider.hasPointerCapture(event.pointerId))paneDivider.releasePointerCapture(event.pointerId);layout.classList.remove('resizing')};
  paneDivider.addEventListener('pointerup',finishResize);paneDivider.addEventListener('pointercancel',finishResize);
  const pythonKeywords=new Set('and as assert async await break case class continue def del elif else except finally for from global if import in is lambda match nonlocal not or pass raise return try while with yield'.split(' '));
  const pythonBuiltins=new Set('abs all any bin bool breakpoint bytearray bytes callable chr classmethod compile complex delattr dict dir divmod enumerate eval exec filter float format frozenset getattr globals hasattr hash help hex id input int isinstance issubclass iter len list locals map max memoryview min next object oct open ord pow print property range repr reversed round set setattr slice sorted staticmethod str sum super tuple type vars zip __import__'.split(' '));
  const pythonConstants=new Set(['True','False','None','NotImplemented','Ellipsis']);
  const tokenPattern=/(#[^\n]*|(?:[rRuUbBfF]{0,2})(?:'''[\s\S]*?(?:'''|$)|"""[\s\S]*?(?:"""|$)|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|(?:0[xX][\da-fA-F](?:_?[\da-fA-F])*|0[bB][01](?:_?[01])*|0[oO][0-7](?:_?[0-7])*|(?:\d(?:_?\d)*)?(?:\.\d(?:_?\d)*)|\d(?:_?\d)*(?:[eE][+-]?\d(?:_?\d)*)?)[jJ]?|@[\p{L}_][\p{L}\p{N}_]*|[\p{L}_][\p{L}\p{N}_]*|(?:\*\*|\/\/|:=|<<|>>|<=|>=|==|!=|->|[-+*\/%&|^~<>:=]))/gu;
  const escapeHtml=value=>value.replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
  function highlightPython(source){
    let html='',lastIndex=0,expectsDefinition=false;
    tokenPattern.lastIndex=0;
    for(const match of source.matchAll(tokenPattern)){
      html+=escapeHtml(source.slice(lastIndex,match.index));
      const token=match[0];let kind='';
      if(token.startsWith('#'))kind='comment';
      else if(/^(?:[rRuUbBfF]{0,2})['"]/.test(token))kind='string';
      else if(/^\d|^\./.test(token))kind='number';
      else if(token.startsWith('@'))kind='decorator';
      else if(pythonKeywords.has(token)){kind='keyword';expectsDefinition=token==='def'||token==='class'}
      else if(expectsDefinition){kind='definition';expectsDefinition=false}
      else if(pythonConstants.has(token))kind='constant';
      else if(pythonBuiltins.has(token))kind='builtin';
      else if(/^[*\/\-+%&|^~<>:=]/.test(token))kind='operator';
      html+=kind?`<span class="token-${kind}">${escapeHtml(token)}</span>`:escapeHtml(token);
      lastIndex=match.index+token.length;
    }
    highlighting.innerHTML=html+escapeHtml(source.slice(lastIndex))+(source.endsWith('\n')?' ':'');
  }
  function update(){
    const count=code.value.split('\n').length;
    lines.textContent=Array.from({length:count},(_,i)=>i+1).join('\n');
    highlightPython(code.value);
    localStorage.pyStudioCode=code.value;
  }
  code.addEventListener('input',update);
  code.addEventListener('scroll',()=>{lines.scrollTop=code.scrollTop;highlightLayer.scrollTop=code.scrollTop;highlightLayer.scrollLeft=code.scrollLeft});
  function changeLineIndent(outdent){
    const value=code.value,start=code.selectionStart,end=code.selectionEnd;
    if(start===end&&!outdent){code.setRangeText('    ',start,end,'end');return}
    const blockStart=value.lastIndexOf('\n',start-1)+1;
    let blockEnd=value.indexOf('\n',end);
    if(blockEnd<0)blockEnd=value.length;
    const selected=value.slice(blockStart,blockEnd),changed=outdent?selected.replace(/^(?: {1,4}|\t)/gm,''):selected.replace(/^/gm,'    ');
    code.setRangeText(changed,blockStart,blockEnd,'select');
    const startRemoved=outdent?(selected.match(/^(?: {1,4}|\t)/)?.[0].length||0):-4;
    code.setSelectionRange(Math.max(blockStart,start-startRemoved),blockStart+changed.length);
  }
  function insertNewlineWithIndent(){
    const start=code.selectionStart,end=code.selectionEnd,lineStart=code.value.lastIndexOf('\n',start-1)+1;
    const beforeCaret=code.value.slice(lineStart,start),indent=beforeCaret.match(/^[ \t]*/)[0];
    const codeBeforeComment=beforeCaret.replace(/#.*$/,'').trimEnd();
    const nextIndent=indent+(codeBeforeComment.endsWith(':')?'    ':'');
    code.setRangeText('\n'+nextIndent,start,end,'end');
  }
  code.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();changeLineIndent(e.shiftKey);update()}
    if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();insertNewlineWithIndent();update()}
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}
  });
  update();
  function add(text,kind=''){const d=document.createElement('div');d.className='entry '+kind;d.textContent=text;out.append(d);out.scrollTop=out.scrollHeight;return d}
  function clear(){out.innerHTML='';out.classList.remove('interface')}
  function showError(error){clear();add(String(error.message||error),'error');state.className='state';state.querySelector('b').textContent='Ошибка'}
  function renderAssets(){
    assetsBox.innerHTML='';
    assets.forEach(asset=>{const item=document.createElement('span');item.className='asset';
      if(asset.type.startsWith('image/')){const image=document.createElement('img');image.src=asset.url;image.alt='';item.append(image)}
      item.append(document.createTextNode(asset.type.startsWith('audio/')?'♫ ':'▣ '));
      const download=document.createElement('a');download.className='asset-download';download.href=asset.url;download.download=asset.name;download.textContent=asset.name;download.title='Скачать '+asset.name;
      item.append(download);assetsBox.append(item);

def _pystudio_prepare_input(source):
    """Compile browser-backed blocking calls so they can be awaited everywhere."""
    tree = ast.parse(source, filename='main.py')
    functions = [node for node in ast.walk(tree)
                 if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))]
    async_names = set()

    messagebox_calls = {'showinfo', 'showwarning', 'showerror', 'askquestion',
                        'askyesno', 'askokcancel', 'askretrycancel', 'askyesnocancel'}

    def is_browser_async_call(call):
        return (isinstance(call, ast.Name) and
                (call.id == 'input' or call.id in messagebox_calls)) or \
               (isinstance(call, ast.Attribute) and
                call.attr in {'tick', 'wait', 'delay', 'mainloop', *messagebox_calls})

    # Include both functions using input directly and helpers which call them.
    changed = True
    while changed:
        changed = False
        for function in functions:
            calls = [node.func for node in ast.walk(function) if isinstance(node, ast.Call)]
            needs_async = any(isinstance(node, ast.Await) for node in ast.walk(function))
            needs_async = needs_async or any((isinstance(call, ast.Name) and
                                              call.id in async_names) or
                                             is_browser_async_call(call)
                              for call in calls)
            needs_async = needs_async or any(isinstance(call, ast.Attribute) and
                                              call.attr in async_names for call in calls)
            if needs_async and function.name not in async_names:
                async_names.add(function.name)
                changed = True

    class InputTransformer(ast.NodeTransformer):
        def __init__(self):
            self.inside_await = False

        def visit_FunctionDef(self, node):
            self.generic_visit(node)
            if node.name not in async_names:
                return node
            replacement = ast.AsyncFunctionDef(
                name=node.name, args=node.args, body=node.body,
                decorator_list=node.decorator_list, returns=node.returns,
                type_comment=node.type_comment)
            return ast.copy_location(replacement, node)

        def visit_Await(self, node):
            previous, self.inside_await = self.inside_await, True
            node.value = self.visit(node.value)
            self.inside_await = previous
            return node

        def visit_Call(self, node):
            self.generic_visit(node)
            is_input = isinstance(node.func, ast.Name) and node.func.id == 'input'
            is_async_call = ((isinstance(node.func, ast.Name) and node.func.id in async_names) or
                             (isinstance(node.func, ast.Attribute) and node.func.attr in async_names) or
                             is_browser_async_call(node.func))
            if is_input:
                node.func = ast.copy_location(ast.Name(id='__pystudio_input', ctx=ast.Load()), node.func)
            if (is_input or is_async_call) and not self.inside_await:
                return ast.copy_location(ast.Await(value=node), node)
            return node

    tree = InputTransformer().visit(tree)
    ast.fix_missing_locations(tree)
    return compile(tree, 'main.py', 'exec', flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)

    if inspect.isawaitable(result):

          const filename=event.name.replaceAll('\\','/').split('/').pop();
          const asset=assets.find(item=>item.name===filename&&item.type.startsWith('audio/'));
          if(asset){const audio=new Audio(asset.url);audio.volume=event.volume;audio.loop=event.loops<0;activeAudio.push(audio);audio.play().catch(()=>{})}
        }
        if(event.kind==='pygame-audio-stop'){activeAudio.forEach(audio=>{audio.pause();audio.currentTime=0});activeAudio=[]}
        if(event.kind==='pygame-audio-pause')activeAudio.forEach(audio=>audio.pause());
        if(event.kind==='pygame-audio-unpause')activeAudio.forEach(audio=>audio.play().catch(()=>{}));
        if(event.kind==='turtle-line'){context.moveTo(320+event.x1,200-event.y1);context.lineTo(320+event.x2,200-event.y2);context.stroke()}
        if(event.kind==='turtle-circle'){context.arc(320+event.x,200-event.y-event.r,Math.abs(event.r),0,Math.PI*2);context.stroke()}
        if(event.kind==='line'){context.moveTo(event.points[0],event.points[1]);context.lineTo(event.points[2],event.points[3]);context.stroke()}
      });
    }
    Array.from(out.children).forEach(child=>{if(child!==interfaceStage)child.remove()});
    out.classList.add('interface');interfaceStage.hidden=false;
  }
  function showMessageBox(request,respond){
    if(guiEvents.some(event=>['window','title','widget'].includes(event.kind)))showInterface();
    else{revealInterface();interfaceCanvas.hidden=true}
    const definitions={
      showinfo:{icon:'info',symbol:'i',buttons:[['OK','ok']]},
      showwarning:{icon:'warning',symbol:'!',buttons:[['OK','ok']]},
      showerror:{icon:'error',symbol:'×',buttons:[['OK','ok']]},
      askquestion:{icon:'question',symbol:'?',buttons:[['Нет','no'],['Да','yes']]},
      askyesno:{icon:'question',symbol:'?',buttons:[['Нет','no'],['Да','yes']]},
      askokcancel:{icon:'question',symbol:'?',buttons:[['Отмена','cancel'],['OK','ok']]},
      askretrycancel:{icon:'warning',symbol:'!',buttons:[['Отмена','cancel'],['Повторить','retry']]},
      askyesnocancel:{icon:'question',symbol:'?',buttons:[['Отмена','cancel'],['Нет','no'],['Да','yes']]}
    };
    const definition=definitions[request.kind]||definitions.showinfo;
    const layer=document.createElement('div');layer.className='tk-modal-layer';
    const dialog=document.createElement('div');dialog.className='tk-messagebox';dialog.dataset.icon=definition.icon;dialog.setAttribute('role','alertdialog');dialog.setAttribute('aria-modal','true');
    const title=document.createElement('div');title.className='tk-messagebox-title';title.textContent=request.title||'Python';
    const content=document.createElement('div');content.className='tk-messagebox-content';
    const icon=document.createElement('span');icon.className='tk-messagebox-icon';icon.setAttribute('aria-hidden','true');icon.textContent=definition.symbol;
    const message=document.createElement('p');message.className='tk-messagebox-text';message.textContent=request.message;content.append(icon,message);
    const actions=document.createElement('div');actions.className='tk-messagebox-actions';
    const finish=value=>{layer.remove();respond(value)};
    definition.buttons.forEach(([label,value],index)=>{const button=document.createElement('button');button.type='button';button.textContent=label;if(index===definition.buttons.length-1)button.className='primary';button.onclick=()=>finish(value);actions.append(button)});
    dialog.append(title,content,actions);layer.append(dialog);interfaceStage.append(layer);
    const buttons=Array.from(actions.children);buttons.at(-1).focus();
    layer.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();finish(definition.buttons[0][1])}if(event.key==='Tab'){event.preventDefault();const index=buttons.indexOf(document.activeElement),step=event.shiftKey?-1:1;buttons[(index+step+buttons.length)%buttons.length].focus()}});
  }
  function setRunning(value){
    isRunning=value;runButton.classList.toggle('stop',value);
    runButton.textContent=value?'■ Стоп':'▶ Запустить';
  }
  function stop(reason='Выполнение остановлено пользователем.'){
    if(!isRunning)return;
    turtleAnimationId++;
    worker?.terminate();worker=undefined;clearTimeout(loadTimer);
    if(pendingInput){pendingInput.input.disabled=true;pendingInput=undefined}
    activeAudio.forEach(audio=>audio.pause());activeAudio=[];
    writePython(reason,'error');setState('','Остановлено');setRunning(false);
  }
  function createPythonWorker(){
    const workerCode=`
      const PYODIDE_URL=${JSON.stringify(PYODIDE_URL)};
      const PYODIDE_BASE_URL=${JSON.stringify(PYODIDE_BASE_URL)};
      const GUI_SHIMS=${JSON.stringify(GUI_SHIMS)};
      const INPUT_TRANSFORM=${JSON.stringify(INPUT_TRANSFORM)};
      let runtime,inputId=0,inputResolvers=new Map(),messageboxId=0,messageboxResolvers=new Map(),stdoutBuffer='',quitRequested=false,turtleClicks=[],tkEvents=[];
      const pressedKeys=new Set();
      const decoder=new TextDecoder();
      const mediaTypes={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',tif:'image/tiff',tiff:'image/tiff',ico:'image/x-icon',avif:'image/avif',ppm:'image/x-portable-pixmap',wav:'audio/wav',mp3:'audio/mpeg',ogg:'audio/ogg',flac:'audio/flac',m4a:'audio/mp4',aac:'audio/aac'};
      function send(type,data={}){postMessage({type,...data})}
      function write(text,kind='result'){if(text!==undefined&&text!==null&&String(text))send('output',{text:String(text),kind})}
      function flush(){if(stdoutBuffer){write(stdoutBuffer);stdoutBuffer=''}}
      function allowWasmWithGenericMimeType(){
        // WebAssembly streaming APIs reject otherwise valid .wasm files when a
        // shared/static host serves them as application/octet-stream. Compile
        // those responses from bytes, while retaining the faster streaming
        // path on correctly configured hosts.
        const wasmMime=/^application\\/wasm(?:;|$)/i;
        if(WebAssembly.compileStreaming){
          const compileStreaming=WebAssembly.compileStreaming.bind(WebAssembly);
          WebAssembly.compileStreaming=async source=>{
            const response=await source;
            return wasmMime.test(response.headers.get('Content-Type')||'')
              ? compileStreaming(response)
              : WebAssembly.compile(await response.arrayBuffer());
          };
        }
        if(WebAssembly.instantiateStreaming){
          const instantiateStreaming=WebAssembly.instantiateStreaming.bind(WebAssembly);
          WebAssembly.instantiateStreaming=async(source,imports)=>{
            const response=await source;
            return wasmMime.test(response.headers.get('Content-Type')||'')
              ? instantiateStreaming(response,imports)
              : WebAssembly.instantiate(await response.arrayBuffer(),imports);
          };
        }
      }
      function sendMediaFiles(){
        const files=[];
        for(const name of runtime.FS.readdir('.')){
          const extension=name.includes('.')?name.split('.').pop().toLowerCase():'';
          if(!mediaTypes[extension])continue;
          const stat=runtime.FS.stat(name);if(!runtime.FS.isFile(stat.mode))continue;
          const data=runtime.FS.readFile(name).slice().buffer;
          files.push({name,type:mediaTypes[extension],data});
        }
        if(files.length)postMessage({type:'media',files},files.map(file=>file.data));
      }
      async function loadThirdPartyPackages(source){
        // Pyodide ships Pillow as a compiled package, while emoji is a pure
        // Python wheel. Load either one (including all of its submodules) before
        // user code runs; aliases cover the names beginners commonly try.
        if(/(^|[;\\n]\\s*)(?:from\\s+PIL(?:\\.|\\s)|import\\s+(?:PIL|pillow)\\b)/m.test(source)){
          send('status',{label:'Загрузка Pillow…'});
          await runtime.loadPackage('pillow');
          await runtime.runPythonAsync("import PIL, sys; sys.modules.setdefault('pillow', PIL)");
        }
        if(/(^|[;\\n]\\s*)(?:from\\s+emoji(?:\\.|\\s)|import\\s+emoji\\b)/m.test(source)){
          send('status',{label:'Загрузка emoji…'});
          await runtime.loadPackage('micropip');
          const micropip=runtime.pyimport('micropip');
          try{await micropip.install(new URL('emoji-2.14.1-py3-none-any.whl',PYODIDE_BASE_URL).href)}finally{micropip.destroy()}
        }
      }
      async function initialize(){
        send('status',{label:'Загрузка Python…'});allowWasmWithGenericMimeType();importScripts(PYODIDE_URL);
        runtime=await loadPyodide({indexURL:PYODIDE_BASE_URL,stderr:text=>write(text,'error'),stdin:()=>''});
        runtime.setStdout({write:bytes=>{stdoutBuffer+=decoder.decode(bytes,{stream:true});let i;while((i=stdoutBuffer.indexOf('\\n'))!==-1){write(stdoutBuffer.slice(0,i));stdoutBuffer=stdoutBuffer.slice(i+1)}return bytes.length}});
      }
      async function run(source,files=[]){
        try{
          if(!runtime)await initialize();
          for(const file of files)runtime.FS.writeFile(file.name,new Uint8Array(file.data));
          send('status',{label:'Проверка импортов…'});
          await loadThirdPartyPackages(source);
          await runtime.loadPackagesFromImports(source,{messageCallback:()=>{},errorCallback:()=>{}});
          runtime.globals.set('__pystudio_gui_event',event=>send('gui',{event:JSON.parse(event)}));
          runtime.globals.set('_pystudio_key_pressed',key=>pressedKeys.has(Number(key)));
          runtime.globals.set('_pystudio_take_quit',()=>{const value=quitRequested;quitRequested=false;return value});
          runtime.globals.set('_pystudio_turtle_take_click',()=>turtleClicks.shift()||null);
          runtime.globals.set('_pystudio_tk_take_event',()=>{const event=tkEvents.shift();return event?JSON.stringify(event):''});
          runtime.globals.set('__pystudio_input',prompt=>new Promise(resolve=>{const id=++inputId;inputResolvers.set(id,resolve);send('input',{id,prompt:String(prompt||'')})}));
          runtime.globals.set('__pystudio_messagebox',(kind,title,message,options)=>new Promise(resolve=>{const id=++messageboxId;messageboxResolvers.set(id,resolve);send('messagebox',{id,kind:String(kind),title:String(title),message:String(message)})}));
          send('executing');await runtime.runPythonAsync(GUI_SHIMS);await runtime.runPythonAsync(INPUT_TRANSFORM);
          let prepared=source;
          if(/(?:from\\s+turtle\\s+import|import\\s+turtle)/.test(source))prepared=prepared.replace(/^(\\s*)([A-Za-z_]\\w*\\.mainloop\\([^\\n]*\\))\\s*$/gm,'$1await $2');
          runtime.globals.set('__pystudio_source',prepared);
          await runtime.runPythonAsync('await __pystudio_run(__pystudio_source)',{filename:'main.py'});
          // A print() without a trailing newline may still be held by Python's
          // TextIOWrapper, so flush Python before draining the worker buffer.
          runtime.runPython('import sys; sys.stdout.flush()');flush();sendMediaFiles();send('done');
        }catch(error){flush();if(runtime)sendMediaFiles();send('error',{message:String(error?.message||error)})}
      }
      onmessage=event=>{const m=event.data;if(m.type==='run')run(m.source,m.files);if(m.type==='input'){const resolve=inputResolvers.get(m.id);if(resolve){inputResolvers.delete(m.id);resolve(m.value)}}if(m.type==='messagebox'){const resolve=messageboxResolvers.get(m.id);if(resolve){messageboxResolvers.delete(m.id);resolve(m.value)}}if(m.type==='tk-event')tkEvents.push(m.event);if(m.type==='key'){m.down?pressedKeys.add(Number(m.key)):pressedKeys.delete(Number(m.key))}if(m.type==='quit')quitRequested=true;if(m.type==='turtle-click')turtleClicks.push([Number(m.x),Number(m.y)])};`;
    const url=URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'}));
    const instance=new Worker(url);URL.revokeObjectURL(url);return instance;
  }
  async function run(){
    if(isRunning){stop();return}
    if(new Blob([code.value]).size>MAX_SOURCE_SIZE){showError(new Error('Программа слишком большая: максимум 200 КБ.'));return}
    clear();outputSize=0;guiEvents=[];setRunning(true);setState('running','Подготовка…');
    const instance=createPythonWorker();worker=instance;
    loadTimer=setTimeout(()=>stop('Не удалось загрузить Python за 60 секунд.'),60000);
    instance.onerror=event=>{event.preventDefault();stop('Ошибка изолированного Python-процесса. Попробуйте запустить программу снова.')};
    instance.onmessage=async event=>{
      if(instance!==worker)return;
      const message=event.data;
      if(message.type==='status')setState('running',message.label);
      if(message.type==='executing'){
        clearTimeout(loadTimer);setState('running','Выполняется');prepareInterface();
      }
      if(message.type==='output'){
        outputSize+=message.text.length;
        if(outputSize<=MAX_OUTPUT_SIZE)writePython(message.text,message.kind);
        else stop('Программа остановлена: превышен лимит вывода 100 КБ.');
      }
      if(message.type==='gui'){
        if(message.event.kind.startsWith('pygame-'))renderPygameEvent(message.event);
        else if(message.event.kind.startsWith('turtle-'))renderTurtleEvent(message.event);
        else{
          guiEvents.push(message.event);
          if(message.event.kind==='mainloop'||(message.event.kind==='widget-config'&&guiEvents.some(item=>item.kind==='mainloop')))showInterface();
        }
      }
      if(message.type==='input'){
        requestConsoleInput(message.prompt).then(value=>{if(instance===worker)instance.postMessage({type:'input',id:message.id,value})});
      }
      if(message.type==='messagebox'){
        showMessageBox(message,value=>{if(instance===worker)instance.postMessage({type:'messagebox',id:message.id,value})});
      }
      if(message.type==='media'){
        message.files.forEach(file=>putAsset(new File([file.data],file.name,{type:file.type})));
        renderAssets();
      }
      if(message.type==='done'){
        clearTimeout(loadTimer);await turtleQueue;if(instance!==worker)return;showInterface();setState('done','Завершено');setRunning(false);instance.terminate();worker=undefined;
      }
      if(message.type==='error'){
        clearTimeout(loadTimer);interfaceStage?.remove();out.classList.remove('interface');writePython(formatPythonError({message:message.message}),'error');setState('','Ошибка');setRunning(false);instance.terminate();worker=undefined;
      }
    };
    try{
      const files=await Promise.all(assets.map(async asset=>({name:asset.name,data:await asset.file.arrayBuffer()})));
      if(instance!==worker)return;
      instance.postMessage({type:'run',source:code.value,files},files.map(file=>file.data));
    }catch(error){
      instance.terminate();if(instance===worker)worker=undefined;clearTimeout(loadTimer);setRunning(false);showError(error);
    }
  }
  const pygameKeys={ArrowLeft:1073741904,ArrowRight:1073741903,ArrowUp:1073741906,ArrowDown:1073741905,Space:32,KeyR:114};
  function sendPygameKey(event,down){
    const pygameKey=pygameKeys[event.code];if(!isRunning||!pygameKey)return;
    event.preventDefault();worker?.postMessage({type:'key',key:pygameKey,down});
  }
  runButton.onclick=run;
  out.addEventListener('click',event=>{
    if(!isRunning||event.target!==interfaceCanvas)return;
    const rect=interfaceCanvas.getBoundingClientRect(),scaleX=interfaceCanvas.width/rect.width,scaleY=interfaceCanvas.height/rect.height;
    worker?.postMessage({type:'turtle-click',x:(event.clientX-rect.left)*scaleX-interfaceCanvas.width/2,y:interfaceCanvas.height/2-(event.clientY-rect.top)*scaleY});
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape')stop();else sendPygameKey(event,true)});
  document.addEventListener('keyup',event=>sendPygameKey(event,false));
  window.addEventListener('blur',()=>{if(isRunning)Object.values(pygameKeys).forEach(key=>worker?.postMessage({type:'key',key,down:false}))});
  document.querySelector('#clear').onclick=clear;document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code.value],{type:'text/x-python'}));a.download='main.py';a.click();URL.revokeObjectURL(a.href)};
})();
</script></body></html>
