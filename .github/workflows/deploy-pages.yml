name: Deploy autonomous editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble self-contained site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/vendor
          cp index.html logo.webp _site/
          touch _site/.nojekyll

          curl --fail --location --retry 3 \
            https://github.com/pyodide/pyodide/releases/download/0.27.7/pyodide-0.27.7.tar.bz2 \
            --output pyodide.tar.bz2
          tar -xjf pyodide.tar.bz2 -C _site/vendor

          python -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --dest _site/vendor/pyodide \
            emoji==2.14.1

          test -f _site/vendor/pyodide/pyodide.js
          test -f _site/vendor/pyodide/pyodide.asm.wasm
          test -f _site/vendor/pyodide/python_stdlib.zip
          test -f _site/vendor/pyodide/pyodide-lock.json
          test -f _site/vendor/pyodide/emoji-2.14.1-py3-none-any.whl

      - name: Upload portable site archive
        uses: actions/upload-artifact@v4
        with:
          name: pystudio-static-site
          path: _site
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
